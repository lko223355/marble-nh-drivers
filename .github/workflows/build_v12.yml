name: Build NetHunter Full Modules v14

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Baixar arquivos do repositorio (config_real_celular.txt)
        uses: actions/checkout@v4

      - name: Instalar dependencias e linux-firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip zstd wget lld linux-firmware

      - name: Baixar ZyC-Clang e GCC64
        run: |
          GH="https://github.com"
          mkdir -p clang
          wget -q "$GH/ZyCromerZ/Clang/releases/download/19.0.0git-20240416-release/Clang-19.0.0git-20240416.tar.gz" -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          git clone --depth=1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" gcc64

      - name: Clonar Melt Kernel Source e Remover ultimo simbolo LED
        run: |
          GH="https://github.com"
          git clone --depth=1 --recurse-submodules --shallow-submodules "$GH/Pzqqt/android_kernel_xiaomi_marble.git" kernel
          git clone --depth=1 "$GH/aircrack-ng/rtl8812au.git" kernel/drivers/net/wireless/rtl8812au
          echo 'source "drivers/net/wireless/rtl8812au/Kconfig"' >> kernel/drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_88XXAU) += rtl8812au/' >> kernel/drivers/net/wireless/Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' kernel/drivers/net/wireless/rtl8812au/Makefile
          sed -i 's/-Werror//g' kernel/drivers/net/wireless/rtl8812au/Makefile
          sed -i 's/-Wno-stringop-overread//g' kernel/drivers/net/wireless/rtl8812au/Makefile
          sed -i 's/-Wno-stringop-overflow//g' kernel/drivers/net/wireless/rtl8812au/Makefile
          echo 'EXTRA_CFLAGS += -DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT -Wno-error -Wno-unknown-warning-option -Wno-incompatible-function-pointer-types -Wno-strict-prototypes -Wno-enum-conversion -Wno-misleading-indentation -Wno-address -Wno-unused-variable' >> kernel/drivers/net/wireless/rtl8812au/Makefile

          python3 -c '
          import glob, re

          gpio_file = "kernel/drivers/net/wireless/ath/ath9k/htc_drv_gpio.c"
          with open(gpio_file, "r") as f:
              s = f.read()

          idx = s.find("ath9k_htc_init_leds")
          if idx != -1:
              start_line = s.rfind("\n", 0, idx)
              s = s[:start_line] + "\nvoid ath9k_htc_init_leds(struct ath9k_htc_priv *priv) {}\nvoid ath9k_htc_deinit_leds(struct ath9k_htc_priv *priv) {}\n"
          with open(gpio_file, "w") as f:
              f.write(s)

          for path in glob.glob("kernel/drivers/net/wireless/ath/ath9k/*.[ch]"):
              with open(path, "r") as f:
                  s = f.read()
              s = re.sub(r"ieee80211_get_radio_led_name\s*\([^)]*\)", "\"ath9k-phy\"", s, flags=re.S)
              s = re.sub(r"ieee80211_create_tpt_led_trigger\s*\([^;]*\);", "", s, flags=re.S)
              with open(path, "w") as f:
                  f.write(s)
          '

      - name: Configurar Kernel com config_real_celular.txt
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          mkdir -p out
          if [ -f "$GITHUB_WORKSPACE/config_real_celular.txt" ]; then
            cp "$GITHUB_WORKSPACE/config_real_celular.txt" out/.config
          else
            cp "$GITHUB_WORKSPACE/marble_melt.config" out/.config
          fi

          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-Melt-v2.5.2" \
            -d CONFIG_LOCALVERSION_AUTO \
            -e CONFIG_MODVERSIONS \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_ALL \
            -d CONFIG_MAC80211_LEDS \
            -d CONFIG_LEDS_TRIGGERS \
            -e CONFIG_WLAN_VENDOR_ATH \
            -m CONFIG_ATH_COMMON \
            -m CONFIG_ATH9K_HW \
            -m CONFIG_ATH9K_COMMON \
            -m CONFIG_ATH9K_HTC \
            -m CONFIG_CARL9170 \
            -m CONFIG_88XXAU \
            -e CONFIG_WLAN_VENDOR_RALINK \
            -m CONFIG_RT2X00 \
            -m CONFIG_RT2800USB \
            -e CONFIG_WLAN_VENDOR_REALTEK \
            -m CONFIG_RTL8187 \
            -m CONFIG_RTL8XXXU \
            -d CONFIG_WLAN_VENDOR_MEDIATEK \
            -d CONFIG_MT7601U \
            -d CONFIG_MT76x0U \
            -d CONFIG_MT76x2U

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules_prepare

      - name: Compilar Apenas Drivers Wi-Fi e Confirmar Zero LED
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- KCFLAGS="-Wno-error -Wno-unknown-warning-option -Wno-incompatible-function-pointer-types -Wno-strict-prototypes -Wno-enum-conversion -Wno-misleading-indentation -Wno-address -Wno-unused-variable" M=drivers/net/wireless modules
          llvm-nm -u out/drivers/net/wireless/ath/ath9k/ath9k_htc.ko | grep -i "ieee80211_get_radio_led_name" && exit 1 || echo "PERFEITO: ath9k_htc.ko 100% limpo!"

      - name: Empacotar Modulo Magisk Completo + Firmwares
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          mkdir -p magisk_mod/META-INF/com/google/android
          mkdir -p magisk_mod/system/lib/modules
          mkdir -p magisk_mod/system/vendor/firmware/ath9k_htc

          find kernel/out/drivers/net/wireless -name "*.ko" -exec cp -f {} magisk_mod/system/lib/modules/ \; 2>/dev/null || true

          llvm-strip --strip-unneeded magisk_mod/system/lib/modules/*.ko

          cp -f /lib/firmware/ath9k_htc/htc_9271-1.4.0.fw magisk_mod/system/vendor/firmware/htc_9271.fw
          cp -f /lib/firmware/ath9k_htc/htc_9271-1.4.0.fw magisk_mod/system/vendor/firmware/ath9k_htc/htc_9271-1.4.0.fw
          cp -f /lib/firmware/ath9k_htc/htc_9271-1.4.0.fw magisk_mod/system/vendor/firmware/htc_9271-1.4.0.fw
          cp -f /lib/firmware/rt2870.bin magisk_mod/system/vendor/firmware/rt2870.bin || true

          cat << 'EOF_UPD' > magisk_mod/META-INF/com/google/android/update-binary
          #!/sbin/sh
          umask 022
          ui_print() { echo "$1"; }
          require_new_magisk() { ui_print "Instale pelo app Magisk ou KernelSU"; exit 1; }
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          [ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk
          . /data/adb/magisk/util_functions.sh
          install_module
          exit 0
          EOF_UPD
          echo "#MAGISK" > magisk_mod/META-INF/com/google/android/updater-script

          cat << 'EOF_PROP' > magisk_mod/module.prop
          id=marble_nethunter_drivers
          name=POCO F5 NetHunter Full Drivers Pack (Melt-v2.5.2)
          version=v14.0
          versionCode=14
          author=lko223355
          description=Drivers AR9271 (TL-WN722N v1 100% sem LED + firmware) e RTL8812AU (88XXau)
          EOF_PROP

          cat << 'EOF_SVC' > magisk_mod/service.sh
          #!/system/bin/sh
          sleep 15
          MODDIR=${0%/*}/system/lib/modules
          for m in eeprom_93cx6 ath ath9k_hw ath9k_common ath9k_htc carl9170 rt2x00lib rt2x00usb rt2800lib rt2800usb rtl8187 rtl8xxxu 88XXau; do
            [ -f "$MODDIR/$m.ko" ] && insmod "$MODDIR/$m.ko" 2>/dev/null
          done
          EOF_SVC
          chmod +x magisk_mod/service.sh

          cd magisk_mod
          zip -r9 "$GITHUB_WORKSPACE/Magisk-NetHunter-FullPack-v14.zip" *

      - name: Upload do Modulo Magisk Completo
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-NetHunter-FullPack-v14
          path: Magisk-NetHunter-FullPack-v14.zip
