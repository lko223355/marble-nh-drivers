name: Build NetHunter Exact Modules (5.10.208-Melt-v2.5.2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Baixar config_real_celular.txt do repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip zstd wget lld

      - name: Baixar ZyC-Clang e GCC64
        run: |
          GH="https://github.com"
          mkdir -p clang
          wget -q "$GH/ZyCromerZ/Clang/releases/download/19.0.0git-20240416-release/Clang-19.0.0git-20240416.tar.gz" -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          git clone --depth=1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" gcc64

      - name: Clonar Melt Kernel Source e Drivers Realtek
        run: |
          GH="https://github.com"
          git clone --depth=1 --recurse-submodules --shallow-submodules "$GH/Pzqqt/android_kernel_xiaomi_marble.git" kernel
          git clone --depth=1 "$GH/aircrack-ng/rtl8812au.git" rtl8812au || true
          git clone --depth=1 "$GH/morrownr/8821cu-20210916.git" rtl8821cu || true

      - name: Configurar Usando o config_real_celular.txt Exato
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          mkdir -p out
          cp "$GITHUB_WORKSPACE/.github/workflows/config_real_celular.txt" out/.config

          # Mantem MAC80211=m e toda a ABI original intocada; adiciona apenas os drivers USB externos
          ./scripts/config --file out/.config \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_ALL \
            -e CONFIG_WLAN_VENDOR_ATH \
            -m CONFIG_ATH_COMMON \
            -m CONFIG_ATH9K_HW \
            -m CONFIG_ATH9K_COMMON \
            -m CONFIG_ATH9K_HTC \
            -m CONFIG_CARL9170 \
            -e CONFIG_WLAN_VENDOR_RALINK \
            -m CONFIG_RT2X00 \
            -m CONFIG_RT2800USB \
            -e CONFIG_WLAN_VENDOR_REALTEK \
            -m CONFIG_RTL8187 \
            -m CONFIG_RTL8XXXU \
            -e CONFIG_WLAN_VENDOR_MEDIATEK \
            -m CONFIG_MT7601U \
            -m CONFIG_MT76x0U \
            -m CONFIG_MT76x2U \
            -m CONFIG_BT_HCIBTUSB \
            -m CONFIG_BT_HCIVHCI \
            -e CONFIG_USB_NET_DRIVERS \
            -m CONFIG_USB_USBNET \
            -m CONFIG_USB_NET_AX8817X \
            -m CONFIG_USB_NET_AX88179_178A \
            -m CONFIG_USB_NET_CDCETHER \
            -m CONFIG_USB_NET_RNDIS_HOST \
            -e CONFIG_USB_SERIAL \
            -m CONFIG_USB_SERIAL_CH341 \
            -m CONFIG_USB_SERIAL_CP210X \
            -m CONFIG_USB_SERIAL_FTDI_SIO \
            -m CONFIG_USB_SERIAL_PL2303

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compilar Modulos Compatíveis (.ko)
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- modules

      - name: Compilar Modulos Externos (RTL8812AU e RTL8821CU)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          KDIR="$GITHUB_WORKSPACE/kernel/out"

          if [ -d "$GITHUB_WORKSPACE/rtl8812au" ]; then
            cd "$GITHUB_WORKSPACE/rtl8812au"
            sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
            sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' Makefile
            make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- KSRC="$KDIR" KCFLAGS="-Wno-error" modules || true
          fi

          if [ -d "$GITHUB_WORKSPACE/rtl8821cu" ]; then
            cd "$GITHUB_WORKSPACE/rtl8821cu"
            sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' Makefile
            sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/g' Makefile
            make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- KSRC="$KDIR" KCFLAGS="-Wno-error" modules || true
          fi

      - name: Empacotar Modulo Magisk Exato
        run: |
          mkdir -p magisk_mod/META-INF/com/google/android
          mkdir -p magisk_mod/system/lib/modules

          find kernel/out/drivers/net/wireless -name "*.ko" ! -name "cnss*" ! -name "wlan_firmware_service.ko" ! -name "mi_cnss*" -exec cp -f {} magisk_mod/system/lib/modules/ \; 2>/dev/null || true
          find kernel/out/drivers/bluetooth -name "*.ko" ! -name "btpower.ko" -exec cp -f {} magisk_mod/system/lib/modules/ \; 2>/dev/null || true
          find kernel/out/drivers/usb/serial -name "*.ko" -exec cp -f {} magisk_mod/system/lib/modules/ \; 2>/dev/null || true
          find kernel/out/drivers/net/usb -name "*.ko" -exec cp -f {} magisk_mod/system/lib/modules/ \; 2>/dev/null || true
          find rtl8812au -name "*.ko" -exec cp -f {} magisk_mod/system/lib/modules/ \; 2>/dev/null || true
          find rtl8821cu -name "*.ko" -exec cp -f {} magisk_mod/system/lib/modules/ \; 2>/dev/null || true

          ls -lh magisk_mod/system/lib/modules/*.ko

          cat << 'EOF_UPD' > magisk_mod/META-INF/com/google/android/update-binary
          #!/sbin/sh
          umask 022
          ui_print() { echo "$1"; }
          require_new_magisk() { ui_print "Instale pelo app Magisk ou KernelSU"; exit 1; }
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          [ -f /data/adb/magisk/util_functions.sh ] || require_new_magisk
          . /data/adb/magisk/util_functions.sh
          install_module
          exit 0
          EOF_UPD
          echo "#MAGISK" > magisk_mod/META-INF/com/google/android/updater-script

          cat << 'EOF_PROP' > magisk_mod/module.prop
          id=marble_nethunter_drivers
          name=POCO F5 NetHunter Exact ABI Drivers (Melt-v2.5.2)
          version=v11.0
          versionCode=11
          author=lko223355
          description=Modulos compilados com o config.gz real do dispositivo (MAC80211=m)
          EOF_PROP

          cat << 'EOF_SVC' > magisk_mod/service.sh
          #!/system/bin/sh
          sleep 15
          MODDIR=${0%/*}/system/lib/modules
          for m in eeprom_93cx6 ath ath9k_hw ath9k_common ath9k_htc carl9170 rt2x00lib rt2x00usb rt2800lib rt2800usb rtl8187 rtl8xxxu 88XXau 8821cu mt76 mt76-usb mt7601u mt76x02-lib mt76x02-usb mt76x0u mt76x2u usbserial ch341 cp210x ftdi_sio pl2303 usbnet cdc_ether rndis_host ax88179_178a asix btintel btrtl btusb hci_vhci; do
            [ -f "$MODDIR/$m.ko" ] && insmod "$MODDIR/$m.ko" 2>/dev/null
          done
          EOF_SVC
          chmod +x magisk_mod/service.sh

          cd magisk_mod
          zip -r9 "$GITHUB_WORKSPACE/Magisk-NetHunter-ExactABI-v11.zip" *

      - name: Upload do Modulo Magisk Exato
        uses: actions/upload-artifact@v4
        with:
          name: Magisk-NetHunter-ExactABI-v11
          path: Magisk-NetHunter-ExactABI-v11.zip
