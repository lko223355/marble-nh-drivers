name: Build Melt Kernel + Aligned Modules v16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias e linux-firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip zstd wget lld linux-firmware cpio

      - name: Baixar ZyC-Clang e GCC64
        run: |
          GH="https://github.com"
          mkdir -p clang
          wget -q "$GH/ZyCromerZ/Clang/releases/download/19.0.0git-20240416-release/Clang-19.0.0git-20240416.tar.gz" -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          git clone --depth=1 "$GH/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git" gcc64

      - name: Clonar Melt Kernel Source e Integrar RTL8812AU
        run: |
          GH="https://github.com"
          git clone --depth=1 --recurse-submodules --shallow-submodules "$GH/Pzqqt/android_kernel_xiaomi_marble.git" kernel
          git clone --depth=1 "$GH/aircrack-ng/rtl8812au.git" kernel/drivers/net/wireless/rtl8812au
          echo 'source "drivers/net/wireless/rtl8812au/Kconfig"' >> kernel/drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_88XXAU) += rtl8812au/' >> kernel/drivers/net/wireless/Makefile
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' kernel/drivers/net/wireless/rtl8812au/Makefile
          sed -i 's/-Werror//g' kernel/drivers/net/wireless/rtl8812au/Makefile
          sed -i 's/-Wno-stringop-overread//g' kernel/drivers/net/wireless/rtl8812au/Makefile
          sed -i 's/-Wno-stringop-overflow//g' kernel/drivers/net/wireless/rtl8812au/Makefile
          echo 'EXTRA_CFLAGS += -DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT -Wno-error -Wno-unknown-warning-option -Wno-incompatible-function-pointer-types -Wno-strict-prototypes -Wno-enum-conversion -Wno-misleading-indentation -Wno-address -Wno-unused-variable -Wno-int-conversion' >> kernel/drivers/net/wireless/rtl8812au/Makefile

      - name: Configurar Kernel Leve + Modulos Alinhados (=m)
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          mkdir -p out
          if [ -f "$GITHUB_WORKSPACE/config_real_celular.txt" ]; then
            cp "$GITHUB_WORKSPACE/config_real_celular.txt" out/.config
          else
            cp "$GITHUB_WORKSPACE/marble_melt.config" out/.config
          fi

          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-Melt-v2.5.2-NH" \
            -d CONFIG_LOCALVERSION_AUTO \
            -d CONFIG_MILLET \
            -e CONFIG_CFG80211 \
            -e CONFIG_CFG80211_WEXT \
            -e CONFIG_MAC80211 \
            -e CONFIG_MAC80211_MESH \
            -e CONFIG_MAC80211_LEDS \
            -e CONFIG_LEDS_TRIGGERS \
            -e CONFIG_WLAN_VENDOR_ATH \
            -m CONFIG_ATH_COMMON \
            -m CONFIG_ATH9K_HW \
            -m CONFIG_ATH9K_COMMON \
            -m CONFIG_ATH9K_HTC \
            -m CONFIG_88XXAU \
            -e CONFIG_WLAN_VENDOR_RALINK \
            -m CONFIG_RT2X00 \
            -m CONFIG_RT2800USB \
            -e CONFIG_WLAN_VENDOR_REALTEK \
            -m CONFIG_RTL8187 \
            -m CONFIG_RTL8XXXU

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Compilar Image Leve + Modulos no Mesmo Build
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- KCFLAGS="-Wno-error -Wno-unknown-warning-option -Wno-incompatible-function-pointer-types -Wno-strict-prototypes -Wno-enum-conversion -Wno-misleading-indentation -Wno-address -Wno-unused-variable -Wno-int-conversion" Image modules

      - name: Empacotar AnyKernel3 (Somente Image) + Modulo Magisk
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$PATH"
          git clone --depth=1 https://github.com -b marble AnyKernel3 || git clone --depth=1 https://github.com AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          cp -f kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/AnyKernel3-Melt-marble-v16.zip" * -x .git\* README.md
          cd "$GITHUB_WORKSPACE"

          mkdir -p magisk_mod/META-INF/com/google/android
          mkdir -p magisk_mod/system/lib/modules
          mkdir -p magisk_mod/system/vendor/firmware/ath9k_htc
          find kernel/out/drivers/net/wireless -name "*.ko" -exec cp -f {} magisk_mod/system/lib/modules/ \; 2>/dev/null || true
          llvm-strip --strip-unneeded magisk_mod/system/lib/modules/*.ko
          cp -f /lib/firmware/ath9k_htc/htc_9271-1.4.0.fw magisk_mod/system/vendor/firmware/htc_9271.fw
          cp -f /lib/firmware/ath9k_htc/htc_9271-1.4.0.fw magisk_mod/system/vendor/firmware/ath9k_htc/htc_9271-1.4.0.fw
          cp -f /lib/firmware/ath9k_htc/htc_9271-1.4.0.fw magisk_mod/system/vendor/firmware/htc_9271-1.4.0.fw

          cat << 'EOF_UPD' > magisk_mod/META-INF/com/google/android/update-binary
          #!/sbin/sh
          umask 022
          ui_print() { echo "$1"; }
          OUTFD=$2
          ZIPFILE=$3
          mount /data 2>/dev/null
          . /data/adb/magisk/util_functions.sh
          install_module
          exit 0
          EOF_UPD
          echo "#MAGISK" > magisk_mod/META-INF/com/google/android/updater-script

          cat << 'EOF_PROP' > magisk_mod/module.prop
          id=marble_nethunter_drivers
          name=POCO F5 NetHunter Aligned Drivers v16
          version=v16.0
          versionCode=16
          author=lko223355
          description=Drivers AR9271 e RTL8812AU compilados contra o Image v16
          EOF_PROP

          cat << 'EOF_SVC' > magisk_mod/service.sh
          #!/system/bin/sh
          sleep 15
          MODDIR=${0%/*}/system/lib/modules
          for m in ath ath9k_hw ath9k_common ath9k_htc rt2x00lib rt2x00usb rt2800lib rt2800usb rtl8187 rtl8xxxu 88XXau; do
            [ -f "$MODDIR/$m.ko" ] && insmod "$MODDIR/$m.ko" 2>/dev/null
          done
          EOF_SVC
          chmod +x magisk_mod/service.sh
          cd magisk_mod
          zip -r9 "$GITHUB_WORKSPACE/Magisk-Modules-v16.zip" *

      - name: Upload dos Pacotes v16
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Full-v16
          path: |
            AnyKernel3-Melt-marble-v16.zip
            Magisk-Modules-v16.zip
